version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@9.15.9 --activate
            - cd ../..
            - pnpm install --no-frozen-lockfile
        build:
          commands:
            - cd ../..
            - pnpm --filter @workspace/web run build
      artifacts:
        baseDirectory: apps/web/dist/public
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .pnpm-store/**/*
